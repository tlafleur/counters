<title>CountUp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #1c1926;
    --surface: #262233;
    --surface-alt: #2e2940;
    --border: #3d3654;
    --text: #ede8f5;
    --text-dim: #9088a6;
    --accent: #f0a848;
    --accent-dim: rgba(240, 168, 72, 0.15);
    --accent-glow: rgba(240, 168, 72, 0.3);
    --purple: #a87cf0;
    --purple-dim: rgba(168, 124, 240, 0.15);
    --danger: #f06060;
    --danger-dim: rgba(240, 96, 96, 0.1);
    --danger-glow: rgba(240, 96, 96, 0.3);
    --paused: #60a8f0;
    --paused-dim: rgba(96, 168, 240, 0.12);
    --paused-glow: rgba(96, 168, 240, 0.25);
    --radius: 20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
    padding: 24px 0 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }
  header .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
  }

  .timer-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 100px;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-dim);
    padding-bottom: 120px;
    text-align: center;
  }
  .empty-state .icon { font-size: 52px; }
  .empty-state p { font-size: 15px; font-weight: 600; }
  .empty-state .hint { font-size: 13px; opacity: 0.6; }

  /* ---- Timer Card ---- */
  .timer-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    position: relative;
    transition: all 0.35s ease;
    overflow: hidden;
  }
  .timer-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: var(--accent);
    border-radius: 5px 0 0 5px;
    transition: background 0.35s;
  }

  /* Running */
  .timer-card.running { border-color: var(--border); }
  .timer-card.running::before { background: var(--accent); }

  /* Paused */
  .timer-card.paused {
    border-color: var(--paused);
    border-style: dashed;
    background: linear-gradient(135deg, var(--paused-dim), var(--surface));
  }
  .timer-card.paused::before { background: var(--paused); }
  .timer-card.paused .timer-display { color: var(--paused); }
  .timer-card.paused .timer-label { color: var(--paused); }
  .paused-indicator {
    display: none;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--paused);
    background: var(--paused-dim);
    padding: 3px 10px;
    border-radius: 8px;
    animation: badgePop 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .timer-card.paused .paused-indicator { display: inline-block; }

  /* Expired */
  .timer-card.expired {
    border-color: var(--danger);
    border-style: solid;
    background: linear-gradient(135deg, var(--danger-dim), var(--surface));
    animation: pulse-border 2s ease-in-out infinite;
  }
  .timer-card.expired::before { background: var(--danger); }
  .timer-card.expired .timer-display { color: var(--danger); }
  .timer-card.expired .timer-label { color: var(--danger); }
  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 0 0 var(--danger-glow); }
    50% { box-shadow: 0 0 24px 2px var(--danger-glow); }
  }

  .expired-badge {
    display: none;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--danger);
    background: var(--danger-dim);
    padding: 3px 10px;
    border-radius: 8px;
    animation: badgePop 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .timer-card.expired .expired-badge { display: inline-block; }
  .timer-card.expired .paused-indicator { display: none; }
  @keyframes badgePop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes fireShake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-4px); }
    30% { transform: translateX(4px); }
    45% { transform: translateX(-3px); }
    60% { transform: translateX(3px); }
    75% { transform: translateX(-1px); }
  }
  .timer-card.shake { animation: fireShake 0.5s ease; }

  .timer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .timer-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .badge-area { display: flex; align-items: center; gap: 6px; }

  .timer-meta {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    opacity: 0.5;
    margin-bottom: 2px;
  }

  .timer-display {
    font-family: 'Space Mono', monospace;
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1px;
  }
  .timer-display .over-label {
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    opacity: 0.6;
    margin-left: 4px;
  }

  .timer-progress {
    height: 4px;
    background: var(--bg);
    border-radius: 4px;
    margin-top: 14px;
    overflow: hidden;
  }
  .timer-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    border-radius: 4px;
    transition: width 0.5s linear;
  }
  .timer-card.paused .timer-progress-fill {
    background: var(--paused);
    opacity: 0.5;
  }
  .timer-card.expired .timer-progress-fill {
    background: var(--danger);
    width: 100% !important;
  }

  /* Action buttons */
  .timer-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .timer-actions button {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--text-dim);
    height: 46px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }
  .timer-actions button:active {
    transform: scale(0.96);
    background: var(--surface-alt);
    color: var(--text);
  }
  .timer-actions .pause-btn { flex: 1.3; }
  .timer-card.paused .pause-btn {
    background: var(--paused-dim);
    border-color: var(--paused);
    color: var(--paused);
  }
  .timer-actions .delete-btn:active {
    color: var(--danger);
    border-color: var(--danger);
    background: var(--danger-dim);
  }
  /* Repeat button */
  .timer-actions .repeat-btn:active {
    color: var(--purple);
    border-color: var(--purple);
    background: var(--purple-dim);
  }

  /* Confirm delete overlay on card */
  .confirm-delete {
    position: absolute;
    inset: 0;
    background: rgba(28, 25, 38, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 5;
    border-radius: var(--radius);
    animation: fadeIn 0.2s ease;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .confirm-delete p {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .confirm-delete .confirm-btns {
    display: flex;
    gap: 10px;
  }
  .confirm-delete button {
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 28px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .confirm-delete button:active { transform: scale(0.95); }
  .confirm-delete .cancel-del {
    background: var(--surface-alt);
    color: var(--text);
    border-color: var(--border);
  }
  .confirm-delete .confirm-del {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* --- Animations --- */
  .timer-card { animation: slideIn 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .timer-card.removing { animation: slideOut 0.3s ease forwards; }
  @keyframes slideOut {
    to { opacity: 0; transform: scale(0.95) translateX(60px); height: 0; padding: 0; margin: 0; border: 0; overflow: hidden; }
  }

  /* --- FAB --- */
  .fab {
    position: fixed;
    bottom: calc(24px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--accent), #e88a30);
    color: var(--bg);
    border: none;
    width: 62px; height: 62px;
    border-radius: 50%;
    font-size: 32px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 28px var(--accent-glow);
    transition: all 0.2s;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab:active { transform: translateX(-50%) scale(0.9); }

  /* --- Overlay & Sheet --- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 28px 28px 0 0;
    padding: 20px 20px calc(24px + var(--safe-bottom));
    z-index: 31;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    max-width: 480px;
    margin: 0 auto;
    border-top: 1.5px solid var(--border);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 0 auto 18px;
  }
  .sheet h2 {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 16px;
  }

  /* Label chips */
  .picker-section { margin-bottom: 16px; }
  .picker-section > label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 8px;
  }
  .label-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .label-chip {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text-dim);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 16px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .label-chip.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .label-chip:active { transform: scale(0.95); }
  .label-custom {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 14px;
    outline: none;
    min-width: 80px;
    flex: 1;
    transition: border-color 0.15s;
  }
  .label-custom:focus { border-color: var(--accent); }
  .label-custom::placeholder { color: var(--text-dim); }

  /* Presets */
  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .presets button {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    color: var(--text-dim);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .presets button.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .presets button:active { transform: scale(0.95); }

  /* Steppers */
  .stepper-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .stepper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: 1;
    max-width: 105px;
  }
  .stepper-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .stepper-btn {
    width: 100%;
    height: 50px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: 20px;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    user-select: none;
    -webkit-user-select: none;
  }
  .stepper-btn:active {
    background: var(--accent-dim);
    border-color: var(--accent);
    transform: scale(0.95);
  }
  .stepper-value {
    font-family: 'Space Mono', monospace;
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
    padding: 6px 0;
    min-width: 55px;
    text-align: center;
    color: var(--text);
    user-select: none;
  }
  .stepper-colon {
    font-family: 'Space Mono', monospace;
    font-size: 30px;
    color: var(--text-dim);
    padding-top: 22px;
    user-select: none;
  }

  .or-divider {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 14px 0;
    position: relative;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    height: 1px;
    width: calc(50% - 20px);
    background: var(--border);
  }
  .or-divider::before { left: 0; }
  .or-divider::after { right: 0; }

  .sheet .start-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #e88a30);
    color: var(--bg);
    border: none;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 16px;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .sheet .start-btn:active { transform: scale(0.97); }
  .sheet .start-btn:disabled { opacity: 0.3; pointer-events: none; box-shadow: none; }

  /* Install banner */
  .install-banner {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
    animation: slideIn 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .install-banner .ib-icon { font-size: 28px; flex-shrink: 0; }
  .install-banner .ib-text { flex: 1; }
  .install-banner .ib-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .install-banner .ib-sub { font-size: 12px; color: var(--text-dim); font-weight: 600; line-height: 1.4; }
  .install-banner .ib-dismiss {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CountUp</h1>
  </header>
  <div class="timer-list" id="timerList">
    <div class="install-banner" id="installBanner" style="display:none">
      <div class="ib-icon">📲</div>
      <div class="ib-text">
        <div class="ib-title">Install for the best experience</div>
        <div class="ib-sub">In Safari, tap <strong>Share ⎋</strong> → <strong>Add to Home Screen</strong> to use as a full-screen app</div>
      </div>
      <button class="ib-dismiss" id="dismissInstall">✕</button>
    </div>
    <div class="empty-state" id="emptyState">
      <div class="icon">🎪</div>
      <p>No timers yet!</p>
      <span class="hint">Tap the + button to start one</span>
    </div>
  </div>
</div>

<button class="fab" id="fabBtn" aria-label="Add timer">+</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2>New Timer</h2>

  <div class="picker-section">
    <label>Label</label>
    <div class="label-row" id="labelRow">
      <button class="label-chip active" data-label="Timer">Timer</button>
      <button class="label-chip" data-label="Cooking">Cooking</button>
      <button class="label-chip" data-label="Laundry">Laundry</button>
      <button class="label-chip" data-label="Focus">Focus</button>
      <button class="label-chip" data-label="Break">Break</button>
      <input class="label-custom" id="customLabel" placeholder="Custom…" maxlength="24">
    </div>
  </div>

  <div class="picker-section">
    <label>Quick Set</label>
    <div class="presets" id="presets">
      <button data-secs="60">1 min</button>
      <button data-secs="180">3 min</button>
      <button data-secs="300">5 min</button>
      <button data-secs="600">10 min</button>
      <button data-secs="900">15 min</button>
      <button data-secs="1500">25 min</button>
      <button data-secs="1800">30 min</button>
      <button data-secs="3600">1 hour</button>
    </div>
  </div>

  <div class="or-divider">or</div>

  <div class="picker-section">
    <div class="stepper-row">
      <div class="stepper">
        <span class="stepper-label">Hours</span>
        <button class="stepper-btn" data-target="hours" data-dir="1">▲</button>
        <div class="stepper-value" id="valHours">0</div>
        <button class="stepper-btn" data-target="hours" data-dir="-1">▼</button>
      </div>
      <span class="stepper-colon">:</span>
      <div class="stepper">
        <span class="stepper-label">Min</span>
        <button class="stepper-btn" data-target="mins" data-dir="1">▲</button>
        <div class="stepper-value" id="valMins">05</div>
        <button class="stepper-btn" data-target="mins" data-dir="-1">▼</button>
      </div>
      <span class="stepper-colon">:</span>
      <div class="stepper">
        <span class="stepper-label">Sec</span>
        <button class="stepper-btn" data-target="secs" data-dir="1">▲</button>
        <div class="stepper-value" id="valSecs">00</div>
        <button class="stepper-btn" data-target="secs" data-dir="-1">▼</button>
      </div>
    </div>
  </div>

  <button class="start-btn" id="startBtn">Start Timer</button>
</div>

<script>
  const timers = [];
  let audioCtx = null;
  let pickerH = 0, pickerM = 5, pickerS = 0;
  let selectedLabel = 'Timer';

  const timerList = document.getElementById('timerList');
  const emptyState = document.getElementById('emptyState');
  const fab = document.getElementById('fabBtn');
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const startBtn = document.getElementById('startBtn');
  const customLabel = document.getElementById('customLabel');
  const valH = document.getElementById('valHours');
  const valM = document.getElementById('valMins');
  const valS = document.getElementById('valSecs');

  // --- Sheet ---
  function openSheet() {
    overlay.classList.add('open');
    sheet.classList.add('open');
    pickerH = 0; pickerM = 5; pickerS = 0;
    selectedLabel = 'Timer';
    customLabel.value = '';
    updatePickerDisplay();
    updateLabelChips();
    updatePresetHighlight();
    updateStartBtn();
  }
  function closeSheet() {
    overlay.classList.remove('open');
    sheet.classList.remove('open');
  }
  fab.addEventListener('click', openSheet);
  overlay.addEventListener('click', closeSheet);

  // --- Labels ---
  document.getElementById('labelRow').addEventListener('click', e => {
    const chip = e.target.closest('.label-chip');
    if (!chip) return;
    selectedLabel = chip.dataset.label;
    customLabel.value = '';
    updateLabelChips();
  });
  customLabel.addEventListener('input', () => {
    if (customLabel.value.trim()) {
      selectedLabel = customLabel.value.trim();
      document.querySelectorAll('.label-chip').forEach(c => c.classList.remove('active'));
    } else {
      selectedLabel = 'Timer';
      updateLabelChips();
    }
  });
  function updateLabelChips() {
    document.querySelectorAll('.label-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.label === selectedLabel);
    });
  }

  // --- Presets ---
  const presetContainer = document.getElementById('presets');
  presetContainer.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const totalSecs = parseInt(btn.dataset.secs);
    pickerH = Math.floor(totalSecs / 3600);
    pickerM = Math.floor((totalSecs % 3600) / 60);
    pickerS = totalSecs % 60;
    updatePickerDisplay();
    updatePresetHighlight();
    updateStartBtn();
  });
  function updatePresetHighlight() {
    const total = pickerH * 3600 + pickerM * 60 + pickerS;
    presetContainer.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.secs) === total);
    });
  }

  // --- Steppers ---
  document.querySelectorAll('.stepper-btn').forEach(btn => {
    const target = btn.dataset.target;
    const dir = parseInt(btn.dataset.dir);
    let isTouch = false;
    function step() {
      if (target === 'hours') pickerH = Math.max(0, Math.min(23, pickerH + dir));
      else if (target === 'mins') { pickerM += dir; if (pickerM < 0) pickerM = 59; if (pickerM > 59) pickerM = 0; }
      else { pickerS += dir; if (pickerS < 0) pickerS = 59; if (pickerS > 59) pickerS = 0; }
      updatePickerDisplay();
      updatePresetHighlight();
      updateStartBtn();
    }
    let holdTimeout, holdInterval;
    const startInteraction = (e) => {
      if (e.type === 'touchstart') { isTouch = true; e.preventDefault(); }
      if (e.type === 'mousedown' && isTouch) return;
      step();
      holdTimeout = setTimeout(() => { holdInterval = setInterval(step, 80); }, 400);
    };
    const stopInteraction = () => { clearTimeout(holdTimeout); clearInterval(holdInterval); };
    btn.addEventListener('touchstart', startInteraction, { passive: false });
    btn.addEventListener('touchend', stopInteraction);
    btn.addEventListener('touchcancel', stopInteraction);
    btn.addEventListener('mousedown', startInteraction);
    btn.addEventListener('mouseup', stopInteraction);
    btn.addEventListener('mouseleave', stopInteraction);
  });

  function updatePickerDisplay() {
    valH.textContent = pickerH;
    valM.textContent = String(pickerM).padStart(2, '0');
    valS.textContent = String(pickerS).padStart(2, '0');
  }
  function updateStartBtn() {
    startBtn.disabled = (pickerH * 3600 + pickerM * 60 + pickerS) <= 0;
  }

  // --- Create timer ---
  startBtn.addEventListener('click', () => {
    initAudio();
    const totalSecs = pickerH * 3600 + pickerM * 60 + pickerS;
    if (totalSecs <= 0) return;
    addTimer(customLabel.value.trim() || selectedLabel, totalSecs);
    closeSheet();
  });

  function addTimer(label, totalSecs) {
    const timer = {
      id: Date.now() + Math.random(),
      label,
      totalSecs,
      startTime: Date.now(),
      paused: false,
      pausedElapsed: 0,
      expired: false,
    };
    timers.push(timer);
    renderTimer(timer);
    updateEmpty();
  }

  // --- Audio ---
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playAlarm() {
    initAudio();
    const now = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const t = now + i * 0.35;
      playTone(740, t, 0.12);
      playTone(988, t + 0.1, 0.14);
      playTone(1175, t + 0.2, 0.18);
    }
  }
  function playTone(freq, start, dur) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur);
  }

  // --- Render ---
  function renderTimer(timer) {
    const card = document.createElement('div');
    card.className = 'timer-card running';
    card.id = 'timer-' + timer.id;
    card.innerHTML =
      '<div class="timer-top">' +
        '<span class="timer-label">' + escHtml(timer.label) + '</span>' +
        '<div class="badge-area">' +
          '<span class="paused-indicator">PAUSED</span>' +
          '<span class="expired-badge">DONE</span>' +
        '</div>' +
      '</div>' +
      '<div class="timer-meta" id="meta-' + timer.id + '">Set for ' + formatTimeLong(timer.totalSecs) + '</div>' +
      '<div class="timer-display" id="display-' + timer.id + '">00:00</div>' +
      '<div class="timer-progress"><div class="timer-progress-fill" id="progress-' + timer.id + '"></div></div>' +
      '<div class="timer-actions">' +
        '<button class="pause-btn" data-id="' + timer.id + '">⏸ Pause</button>' +
        '<button class="repeat-btn" data-id="' + timer.id + '">🔁 Again</button>' +
        '<button class="delete-btn" data-id="' + timer.id + '">✕</button>' +
      '</div>';
    card.querySelector('.pause-btn').addEventListener('click', () => togglePause(timer.id));
    card.querySelector('.repeat-btn').addEventListener('click', () => repeatTimer(timer.id));
    card.querySelector('.delete-btn').addEventListener('click', () => confirmDelete(timer.id));
    emptyState.before(card);
  }

  function updateEmpty() {
    emptyState.style.display = timers.length === 0 ? 'flex' : 'none';
  }

  // --- Controls ---
  function togglePause(id) {
    const t = timers.find(x => x.id === id);
    if (!t) return;
    const card = document.getElementById('timer-' + id);
    const btn = card.querySelector('.pause-btn');
    if (t.paused) {
      t.startTime = Date.now() - t.pausedElapsed;
      t.paused = false;
      card.classList.remove('paused');
      card.classList.add('running');
      btn.textContent = '⏸ Pause';
    } else {
      t.pausedElapsed = Date.now() - t.startTime;
      t.paused = true;
      card.classList.remove('running');
      card.classList.add('paused');
      btn.textContent = '▶ Resume';
    }
  }

  function repeatTimer(id) {
    const t = timers.find(x => x.id === id);
    if (!t) return;
    initAudio();
    addTimer(t.label, t.totalSecs);
  }

  function confirmDelete(id) {
    const card = document.getElementById('timer-' + id);
    if (!card || card.querySelector('.confirm-delete')) return;
    const confirm = document.createElement('div');
    confirm.className = 'confirm-delete';
    confirm.innerHTML =
      '<p>Remove this timer?</p>' +
      '<div class="confirm-btns">' +
        '<button class="cancel-del">Keep</button>' +
        '<button class="confirm-del">Remove</button>' +
      '</div>';
    confirm.querySelector('.cancel-del').addEventListener('click', (e) => {
      e.stopPropagation();
      confirm.remove();
    });
    confirm.querySelector('.confirm-del').addEventListener('click', (e) => {
      e.stopPropagation();
      removeTimer(id);
    });
    card.appendChild(confirm);
  }

  function removeTimer(id) {
    const idx = timers.findIndex(x => x.id === id);
    if (idx === -1) return;
    timers.splice(idx, 1);
    const card = document.getElementById('timer-' + id);
    if (card) {
      card.classList.add('removing');
      setTimeout(() => { card.remove(); updateEmpty(); }, 300);
    }
  }

  function formatTime(totalSecs) {
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = Math.floor(totalSecs % 60);
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function formatTimeLong(totalSecs) {
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = totalSecs % 60;
    const parts = [];
    if (h) parts.push(h + 'h');
    if (m) parts.push(m + 'm');
    if (s && !h) parts.push(s + 's');
    return parts.join(' ') || '0s';
  }

  // --- Tick ---
  function tick() {
    for (const t of timers) {
      const elapsed = t.paused ? t.pausedElapsed / 1000 : (Date.now() - t.startTime) / 1000;
      const remaining = t.totalSecs - elapsed;
      const display = document.getElementById('display-' + t.id);
      const progress = document.getElementById('progress-' + t.id);
      const card = document.getElementById('timer-' + t.id);
      if (!display) continue;

      if (remaining > 0) {
        display.textContent = formatTime(remaining);
        if (progress) progress.style.width = ((elapsed / t.totalSecs) * 100).toFixed(1) + '%';
      } else {
        if (!t.expired) {
          t.expired = true;
          card.classList.remove('running', 'paused');
          card.classList.add('expired');
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 600);
          playAlarm();
          if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
        }
        display.innerHTML = '+' + formatTime(Math.abs(remaining)) + '<span class="over-label">over</span>';
      }
    }
    requestAnimationFrame(tick);
  }
  tick();

  function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Dynamic page title (shows most urgent timer in browser tab) ---
  function updateTitle() {
    let mostUrgent = null;
    let smallestRemaining = Infinity;
    for (const t of timers) {
      if (t.expired) continue;
      const elapsed = t.paused ? t.pausedElapsed / 1000 : (Date.now() - t.startTime) / 1000;
      const remaining = t.totalSecs - elapsed;
      if (remaining > 0 && remaining < smallestRemaining) {
        smallestRemaining = remaining;
        mostUrgent = t;
      }
    }
    const expiredCount = timers.filter(t => t.expired).length;
    if (expiredCount > 0) {
      document.title = '🔴 ' + expiredCount + ' done — CountUp';
    } else if (mostUrgent) {
      document.title = formatTime(smallestRemaining) + ' — ' + mostUrgent.label;
    } else {
      document.title = 'CountUp';
    }
  }
  setInterval(updateTitle, 1000);

  // --- Install banner (show on mobile Safari, not in standalone mode) ---
  (function() {
    const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
    const isMobile = /iPhone|iPad|iPod|Android/.test(navigator.userAgent);
    const dismissed = localStorage.getItem('install-dismissed');

    if (!isStandalone && isMobile && !dismissed) {
      const banner = document.getElementById('installBanner');
      banner.style.display = 'flex';
      document.getElementById('dismissInstall').addEventListener('click', () => {
        banner.style.display = 'none';
        localStorage.setItem('install-dismissed', '1');
      });
    }
  })();

  // --- Inline service worker for offline support ---
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    const swCode = `
      const CACHE = 'countup-v1';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }
</script>
</body>
</html>
